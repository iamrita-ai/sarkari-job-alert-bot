# Render deployment blueprint - https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: sarkari-job-alert-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false          # set this secret manually in Render dashboard
      - key: CHECK_INTERVAL_MINUTES
        value: "30"
      - key: OWNER_USERNAMES
        value: "TechnicalSerena,Xioqui_xin"
      - key: ENABLE_HEALTH_SERVER
        value: "true"
      - key: SOURCE_ORDER
        value: "mirror,original,original-jina"
      - key: MIRROR_BASE_URL
        value: "https://sarkariresult.com.cm"
      - key: USE_JINA_FALLBACK
        value: "true"
      - key: JINA_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: "data/bot.db"
      # --- optional v1.5 extras (set in the Render dashboard) -----------
      # - key: ENABLE_WEB_APP
      #   value: "true"          # needs a Docker build with INSTALL_WEB=true
      # - key: WEB_APP_SECRET
      #   sync: false
      # - key: BROADCAST_CHANNEL_ID
      #   sync: false
      # - key: GROQ_API_KEY
      #   sync: false
# NOTE: free web services sleep after inactivity. The bot itself keeps
# polling Telegram while awake, but Render may restart the container.
# For 24x7 guaranteed uptime use a paid instance and attach a 1 GB disk
# mounted at /app/data so the SQLite database persists across deploys.
