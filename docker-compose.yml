services:
  sarkari-job-alert-bot:
    build:
      context: .
      args:
        # Set to "true" to bake the optional web dashboard (FastAPI) into the
        # image, then uncomment ENABLE_WEB_APP / WEB_APP_PORT below.
        INSTALL_WEB: "false"
    image: sarkari-job-alert-bot:latest
    container_name: sarkari-job-alert-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENABLE_HEALTH_SERVER: "true"
      PORT: "8080"
      # --- optional web dashboard (v1.5) -------------------------------
      # ENABLE_WEB_APP: "true"
      # WEB_APP_PORT: "8081"
      # WEB_APP_SECRET: "replace-with-a-long-random-string"
      # PUBLIC_BASE_URL: "https://your-domain"
    ports:
      - "8080:8080"
      # - "8081:8081"
    volumes:
      # Named volume keeps the SQLite database across container rebuilds
      - sarkari_job_data:/app/data

volumes:
  sarkari_job_data:
